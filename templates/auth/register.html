{% extends "base.html" %}
{% block title %}Register — CertifyPro{% endblock %}
{% block content %}
<div class="auth-container fade-in">
    <div class="auth-card glass">
        <div class="auth-header">
            <div class="auth-logo"><i class="fas fa-user-graduate"></i></div>
            <h2>Create Account</h2>
            <p>Join CertifyPro as a student</p>
        </div>
        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="full_name"><i class="fas fa-id-card"></i> Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="student_id"><i class="fas fa-id-badge"></i> Student ID</label>
                    <input type="text" id="student_id" name="student_id" placeholder="e.g., S12345" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="username"><i class="fas fa-user-circle"></i> Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="department"><i class="fas fa-building"></i> Department</label>
                    <input type="text" id="department" name="department" placeholder="e.g., Computer Science">
                </div>
                <div class="form-group">
                    <label for="semester"><i class="fas fa-layer-group"></i> Semester</label>
                    <input type="number" id="semester" name="semester" value="1" min="1" max="12">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password"><i class="fas fa-check-circle"></i> Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="6">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
