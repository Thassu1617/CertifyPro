{% extends "base.html" %}
{% block title %}Login — CertifyPro{% endblock %}
{% block content %}
<div class="auth-container fade-in">
    <div class="auth-card glass">
        <div class="auth-header">
            <div class="auth-logo"><i class="fas fa-certificate"></i></div>
            <h2>Welcome Back</h2>
            <p>Login to your CertifyPro account</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Create one here</a>
        </p>
    </div>
</div>
{% endblock %}
