{% extends "base.html" %}
{% block title %}Add Marks — CertifyPro{% endblock %}
{% block content %}
<div class="admin-layout">
    <aside class="admin-sidebar glass">{% include "admin/_sidebar.html" %}</aside>
    <div class="admin-main">
        {% include "admin/_topbar.html" %}
        <div class="admin-content">
            <div class="page-header">
                <h1><i class="fas fa-clipboard-list"></i> Add Marks</h1>
                <a href="{{ url_for('admin.marks') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
            </div>

            <div class="form-card glass fade-in">
                <form method="POST" class="admin-form">
                    <div class="form-columns">
                        <div class="form-left">
                            <h3><i class="fas fa-user-graduate"></i> Student & Course</h3>
                            <div class="form-group">
                                <label for="student_id"><i class="fas fa-user"></i> Student <span class="required">*</span></label>
                                <select id="student_id" name="student_id" required>
                                    <option value="">Select Student...</option>
                                    {% for s in students %}
                                    <option value="{{ s.id }}">{{ s.user.full_name }} ({{ s.student_id }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="course_id"><i class="fas fa-book"></i> Course <span class="required">*</span></label>
                                <select id="course_id" name="course_id" required>
                                    <option value="">Select Course...</option>
                                    {% for c in courses %}
                                    <option value="{{ c.id }}">{{ c.course_code }} — {{ c.course_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="semester"><i class="fas fa-layer-group"></i> Semester</label>
                                    <input type="number" id="semester" name="semester" value="1" min="1" max="12">
                                </div>
                                <div class="form-group">
                                    <label for="exam_type"><i class="fas fa-tag"></i> Exam Type</label>
                                    <select id="exam_type" name="exam_type">
                                        <option value="internal">Internal</option>
                                        <option value="midterm">Midterm</option>
                                        <option value="final" selected>Final</option>
                                        <option value="practical">Practical</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-right">
                            <h3><i class="fas fa-chart-bar"></i> Marks Breakdown</h3>
                            <div class="marks-grid">
                                <div class="form-group">
                                    <label for="attendance"><i class="fas fa-calendar-check"></i> Attendance Marks</label>
                                    <input type="number" id="attendance" name="attendance" value="0" min="0" max="100" step="0.1">
                                    <small class="form-hint">Max 100</small>
                                </div>
                                <div class="form-group">
                                    <label for="assignments"><i class="fas fa-tasks"></i> Assignment Marks</label>
                                    <input type="number" id="assignments" name="assignments" value="0" min="0" max="100" step="0.1">
                                    <small class="form-hint">Max 100</small>
                                </div>
                                <div class="form-group">
                                    <label for="quiz_scores"><i class="fas fa-question-circle"></i> Quiz Marks</label>
                                    <input type="number" id="quiz_scores" name="quiz_scores" value="0" min="0" max="100" step="0.1">
                                    <small class="form-hint">Max 100</small>
                                </div>
                                <div class="form-group" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
                                    <label><i class="fas fa-calculator"></i> Internal Total</label>
                                    <div class="computed-total" id="internalTotal">0.0 / 300</div>
                                </div>
                            </div>

                            <h3 style="margin-top:20px"><i class="fas fa-file-alt"></i> External Exam</h3>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="marks_obtained"><i class="fas fa-star"></i> Marks Obtained <span class="required">*</span></label>
                                    <input type="number" id="marks_obtained" name="marks_obtained" value="0" min="0" step="0.1">
                                </div>
                                <div class="form-group">
                                    <label for="total_marks"><i class="fas fa-maximize"></i> Total Marks <span class="required">*</span></label>
                                    <input type="number" id="total_marks" name="total_marks" value="100" min="1" step="0.1">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="{{ url_for('admin.marks') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Add Marks</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
