{% extends "base.html" %}
{% block title %}Add Question — CertifyPro{% endblock %}
{% block content %}
<div class="admin-layout">
    <aside class="admin-sidebar glass">{% include "admin/_sidebar.html" %}</aside>
    <div class="admin-main">
        {% include "admin/_topbar.html" %}
        <div class="admin-content">
            <div class="page-header">
                <h1><i class="fas fa-plus-circle"></i> Add Question — {{ exam.title }}</h1>
                <a href="{{ url_for('admin.exam_questions', exam_id=exam.id) }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
            </div>

            <div class="form-card glass fade-in">
                <form method="POST" class="admin-form">
                    <div class="form-group">
                        <label for="question_text"><i class="fas fa-question-circle"></i> Question <span class="required">*</span></label>
                        <textarea id="question_text" name="question_text" rows="3" placeholder="Enter the question text..." required style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:var(--radius-sm);font-size:0.88rem;font-family:inherit;outline:none;width:100%"></textarea>
                    </div>

                    <div class="form-row" style="margin-bottom:0">
                        <div class="form-group">
                            <label for="option_a"><i class="fas fa-circle" style="color:#ff6b6b"></i> Option A <span class="required">*</span></label>
                            <input type="text" id="option_a" name="option_a" placeholder="Option A" required>
                        </div>
                        <div class="form-group">
                            <label for="option_b"><i class="fas fa-circle" style="color:#4ecdc4"></i> Option B <span class="required">*</span></label>
                            <input type="text" id="option_b" name="option_b" placeholder="Option B" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="option_c"><i class="fas fa-circle" style="color:#ffd93d"></i> Option C <span class="required">*</span></label>
                            <input type="text" id="option_c" name="option_c" placeholder="Option C" required>
                        </div>
                        <div class="form-group">
                            <label for="option_d"><i class="fas fa-circle" style="color:#6c5ce7"></i> Option D <span class="required">*</span></label>
                            <input type="text" id="option_d" name="option_d" placeholder="Option D" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="correct_answer"><i class="fas fa-check-circle" style="color:var(--accent)"></i> Correct Answer <span class="required">*</span></label>
                            <select id="correct_answer" name="correct_answer" required>
                                <option value="">Select...</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="marks"><i class="fas fa-star"></i> Marks <span class="required">*</span></label>
                            <input type="number" id="marks" name="marks" value="1" min="0.5" max="100" step="0.5" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="{{ url_for('admin.exam_questions', exam_id=exam.id) }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Add Question</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
