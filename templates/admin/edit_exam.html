{% extends "base.html" %}
{% block title %}Edit Exam — CertifyPro{% endblock %}
{% block content %}
<div class="admin-layout">
    <aside class="admin-sidebar glass">{% include "admin/_sidebar.html" %}</aside>
    <div class="admin-main">
        {% include "admin/_topbar.html" %}
        <div class="admin-content">
            <div class="page-header">
                <h1><i class="fas fa-edit"></i> Edit Exam</h1>
                <a href="{{ url_for('admin.exams') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
            </div>

            <div class="form-card glass fade-in">
                <form method="POST" class="admin-form">
                    <div class="form-columns">
                        <div class="form-left">
                            <h3><i class="fas fa-info-circle"></i> Exam Details</h3>
                            <div class="form-group">
                                <label for="title"><i class="fas fa-heading"></i> Exam Title <span class="required">*</span></label>
                                <input type="text" id="title" name="title" value="{{ exam.title }}" required>
                            </div>
                            <div class="form-group">
                                <label for="course_id"><i class="fas fa-book"></i> Course <span class="required">*</span></label>
                                <select id="course_id" name="course_id" required>
                                    {% for c in courses %}
                                    <option value="{{ c.id }}" {{ 'selected' if c.id == exam.course_id }}>{{ c.course_code }} — {{ c.course_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="duration_minutes"><i class="fas fa-clock"></i> Duration (minutes)</label>
                                    <input type="number" id="duration_minutes" name="duration_minutes" value="{{ exam.duration_minutes }}" min="1" max="480">
                                </div>
                                <div class="form-group">
                                    <label for="total_questions"><i class="fas fa-list-ol"></i> Total Questions</label>
                                    <input type="number" id="total_questions" name="total_questions" value="{{ exam.total_questions }}" min="1" max="200">
                                </div>
                            </div>
                        </div>
                        <div class="form-right">
                            <h3><i class="fas fa-cog"></i> Configuration</h3>
                            <div class="form-group">
                                <label for="passing_percentage"><i class="fas fa-check-circle"></i> Passing Percentage</label>
                                <input type="number" id="passing_percentage" name="passing_percentage" value="{{ exam.passing_percentage }}" min="0" max="100" step="0.1">
                            </div>
                            <div class="form-group">
                                <label for="max_marks"><i class="fas fa-trophy"></i> Maximum Marks</label>
                                <input type="number" id="max_marks" name="max_marks" value="{{ exam.max_marks }}" min="1" step="0.5">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="{{ url_for('admin.exams') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Exam</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
